# proofload Redis Sentinel (sentinel1/2/3). Monitors the primary "redis1" with a
# quorum of 2 of 3. Hostnames are resolved/announced so the compose service names
# (redis1, redis2, redis3) work in place of IPs. protected-mode is off so the
# three sentinels can gossip across containers on 26379 without auth.
#
# This file is mounted read-only as a template; the compose command copies it to
# a writable path per container because Sentinel rewrites its config at runtime
# (and refuses to start on a read-only file). The checked-in template is never
# mutated.
port 26379
protected-mode no
sentinel resolve-hostnames yes
sentinel announce-hostnames yes
sentinel monitor proofload redis1 6379 2
sentinel down-after-milliseconds proofload 5000
sentinel failover-timeout proofload 10000
sentinel parallel-syncs proofload 1
