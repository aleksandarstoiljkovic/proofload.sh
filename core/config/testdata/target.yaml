target: postgresql
image: postgres
version: "16"
defaults:
  connections: 64
  warmup: 60s
  duration: 300s
cluster:
  backend: kubernetes
  nodes: 3
  replication_factor: 3
  consistency: [read-committed, serializable]
capabilities:
  verify_models: [reconciliation, register]
  faults: [kill-node, pause-node, network-partition]
